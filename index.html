<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ML Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>ML Flashcards</h1>
  <span class="deck-label" id="deck-label">Google ML Glossary</span>
</header>

<!-- Category selector — buttons injected by app.js -->
<div class="category-selector" id="category-selector"></div>

<div class="progress-wrap">
  <div class="progress-meta">
    <span class="progress-count" id="progress-count">1 / 1</span>
    <span class="progress-count" id="progress-pct">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
  </div>
</div>

<div class="scene" id="scene" onclick="flipCard()">
  <div class="card" id="card">
    <div class="card-face card-front">
      <span class="card-face-label">Term</span>
      <span class="card-timer" id="card-timer">0:00</span>
      <div class="term" id="card-term"></div>
      <span class="category-tag" id="card-category"></span>
      <div class="tap-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
        tap to flip
      </div>
    </div>
    <div class="card-face card-back">
      <span class="card-face-label">Definition</span>
      <div class="definition" id="card-definition"></div>
    </div>
  </div>
</div>

<!-- Archive button — outside scene so click doesn't trigger flipCard -->
<div class="archive-row">
  <button class="btn-archive" id="btn-archive" onclick="toggleArchive()">Archive</button>
</div>

<!-- Judgment buttons — shown when card is flipped, outside scene to avoid triggering flip -->
<div class="judgment-row hidden" id="judgment-row">
  <button class="btn-judgment btn-horrible"   id="btn-horrible"   onclick="judgeCard('horrible')">Horrible</button>
  <button class="btn-judgment btn-ok"         id="btn-ok"         onclick="judgeCard('ok')">Ok</button>
  <button class="btn-judgment btn-gettingit"  id="btn-gettingit"  onclick="judgeCard('gettingit')">Getting it</button>
  <button class="btn-judgment btn-gotit"      id="btn-gotit"      onclick="judgeCard('gotit')">Got it!</button>
</div>

<div class="controls">
  <button class="btn btn-prev" id="btn-prev" onclick="navigate(-1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
    Prev
  </button>

  <button class="btn btn-shuffle" id="btn-shuffle" onclick="shuffle()" title="Shuffle deck">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
  </button>

  <button class="btn btn-next" id="btn-next" onclick="navigate(1)">
    Next
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </button>
</div>

<!-- Related cards — shown below controls when card is flipped -->
<div class="related-cards hidden" id="related-cards"></div>

<!-- Archived cards panel -->
<div class="archived-section">
  <div class="archived-header">
    <button class="archived-toggle-btn" id="archived-toggle-btn" onclick="toggleShowArchived()">
      Archived <span id="archived-count">0</span>
    </button>
    <label class="archived-include-label">
      <input type="checkbox" id="include-archived" onchange="toggleIncludeArchived()">
      Include in deck
    </label>
  </div>
  <div class="archived-list hidden" id="archived-list"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
